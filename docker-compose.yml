services:
  postgres:
    build:
      context: .
      dockerfile: infra/database/postgres/Dockerfile
    container_name: incident_postgres
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - vault_tok_postgres:/vault/token
    networks:
      - incident_network
    depends_on:
      vault:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1"]
      interval: 5s
      timeout: 5s
      retries: 20
  postgres-backup:
    build:
      context: .
      dockerfile: infra/database/db-backup-service/Dockerfile
    container_name: incident_postgres_backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
    volumes:
      - ./backups:/backups
      - vault_tok_backup:/vault/token
    networks:
      - incident_network
    depends_on:
      - postgres

  migrate:
    build:
      context: .
      dockerfile: infra/database/migrate/Dockerfile
    container_name: incident_migrate
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
    volumes:
      - vault_tok_migrate:/vault/token
    networks:
      - incident_network
    depends_on:
      postgres:
        condition: service_healthy
      vault:
        condition: service_healthy

  vault:
    build:
      context: ./infra/vault
      dockerfile: Dockerfile
    container_name: incident_vault
    ports:
      - "8200:8200"
    cap_add:
      - IPC_LOCK
    volumes:
      - vault_init:/vault/init
      - vault_data:/vault/data
      - vault_tok_backend:/vault/tokens/backend
      - vault_tok_postgres:/vault/tokens/postgres
      - vault_tok_grafana:/vault/tokens/grafana
      - vault_tok_exporter:/vault/tokens/exporter
      - vault_tok_backup:/vault/tokens/backup
      - vault_tok_migrate:/vault/tokens/migrate
    env_file:
      - ./infra/vault/.env
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "test -f /vault/init/.ready && vault status -format=json | jq -e '.sealed == false' >/dev/null",
        ]
      interval: 2s
      timeout: 2s
      retries: 60
    networks:
      - incident_network

  prometheus:
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./infra/monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - incident_network

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      VAULT_TOKEN_FILE: /vault/token/token
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
      - vault_tok_backend:/vault/token
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
      vault:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD-SHELL",
          'node -e "fetch(''http://localhost:3000/api/v1/health'').then(r => process.exit(r.ok ? 0 : 1)).catch(() => process.exit(1))"',
        ]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 300s
    ports:
      - "3000:3000"
    networks:
      - incident_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: incident_frontend
    ports:
      - "4173:80"
    env_file:
      - ./frontend/.env
    depends_on:
      backend:
        condition: service_healthy
    networks:
      - incident_network

  grafana:
    build:
      context: .
      dockerfile: infra/monitoring/grafana-image/Dockerfile
    container_name: grafana
    restart: unless-stopped
    environment:
      GF_SERVER_ROOT_URL: "https://localhost:8443/grafana/"
      GF_SERVER_SERVE_FROM_SUB_PATH: "false"
      GF_SERVER_PROTOCOL: "http"
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
    ports:
      - "3001:3000"
    depends_on:
      vault:
        condition: service_healthy
    volumes:
      - grafana-data:/var/lib/grafana
      - vault_tok_grafana:/vault/token
      - ./infra/monitoring/grafana/provisioning:/etc/grafana/provisioning
      - ./infra/monitoring/grafana/dashboards:/etc/grafana/dashboards
    networks:
      - incident_network

  waf:
    build:
      context: ./infra/waf
      dockerfile: Dockerfile
    container_name: incident_waf
    environment:
      ALLOWED_METHODS: "GET HEAD POST OPTIONS PUT PATCH DELETE"
    ports:
      - "8080:80"
      - "8443:443"
    depends_on:
      frontend:
        condition: service_started
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -fsSk https://localhost/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s
    networks:
      - incident_network

  postgres-exporter:
    build:
      context: .
      dockerfile: infra/monitoring/postgres-exporter/Dockerfile
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN_FILE: /vault/token/token
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_SCRAPE_DB: postgres
    volumes:
      - vault_tok_exporter:/vault/token
    depends_on:
      postgres:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - incident_network

volumes:
  prometheus_data:
  postgres_data:
  vault_init:
  vault_data:
  vault_tok_backend:
  vault_tok_postgres:
  vault_tok_grafana:
  vault_tok_exporter:
  vault_tok_backup:
  grafana-data:
  vault_tok_migrate:

networks:
  incident_network:
    driver: bridge
