services:
  postgres:
    image: postgres:18
    container_name: incident_postgres
    environment:
      POSTGRES_USER: incident_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: incident_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - incident_network

volumes:
  postgres_data:

networks:
  incident_network:
    driver: bridge