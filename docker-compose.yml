services:
  postgres:
    image: postgres:18
    container_name: incident_postgres
    environment:
      POSTGRES_USER: incident_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: incident_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
    networks:
      - incident_network
  postgres-backup:
    build:
      context: ./infra/scripts/db-backup-service
      dockerfile: ./Dockerfile
    container_name: incident_postgres_backup
    restart: always
    environment:
      POSTGRES_HOST: postgres
      POSTGRES_USER: incident_admin
      POSTGRES_PASSWORD: super_secret_password
      POSTGRES_DB: incident_db
      WEBHOOK_URL: https://webhook.site/eae4ccf4-8eda-4244-97cb-491de120a0d5
    volumes:
      - ./backups:/backups
    networks:
      - incident_network
    depends_on:
      - postgres

  prometheus:
    image: prom/prometheus:v3.13.0
    restart: unless-stopped
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --storage.tsdb.retention.time=15d
      - --storage.tsdb.retention.size=2GB
    volumes:
      - ./monitoring/prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "9090:9090"
    networks:
      - incident_network

  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    volumes:
      - ./backend/src:/app/src
      - ./backend/prisma:/app/prisma
    depends_on:
      - postgres
    ports:
      - "8000:3000"
    networks:
      - incident_network

  grafana:
    image: grafana/grafana:13.2.2
    container_name: grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    volumes:
      - grafana-data:/var/lib/grafana
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
    networks:
      - incident_network

volumes:
  prometheus_data:
  postgres_data:
  grafana-data:

networks:
  incident_network:
    driver: bridge
