name: PR Check & Notify
on:
  pull_request:
    branches:
      - dev
      - main

jobs:
  test:
    name: Run Unit Tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npx prisma generate

      - name: Run Tests
        run: npm test

  # This job ALWAYS runs when 'test' completes, whether tests pass OR fail
  notify:
    name: Notify Discord
    needs: test
    if: always() && github.event.action == 'opened'
    runs-on: ubuntu-latest
    steps:
      - name: Send Discord Notification
        run: |
          # Determine status icon based on the 'test' job outcome
          STATUS="${{ needs.test.result }}"
          if [ "$STATUS" = "success" ]; output="🟢 Tests Passed"; else output="🔴 Tests Failed"; fi

          curl -H "Content-Type: application/json" \
            -X POST \
            -d "{
              \"embeds\": [{
                \"title\": \"🔀 New PR Opened ($output)\",
                \"url\": \"${{ github.event.pull_request.html_url }}\",
                \"fields\": [
                  { \"name\": \"Title\", \"value\": \"${{ github.event.pull_request.title }}\" },
                  { \"name\": \"Author\", \"value\": \"${{ github.actor }}\" }
                ]
              }]
            }" \
            ${{ secrets.DISCORD_WEBHOOK_URL }}
